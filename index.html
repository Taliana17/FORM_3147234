<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cuadro">
        <h1>FORMULARIO DEL SENA</h1>
        <h2>Gracias por dejar su datos</h2>
        <div class="form-container">
    <form>
      <label>Name</label>
      <input type="text" placeholder="Please enter your name">

      <label>Email</label>
      <input type="email" placeholder="Please enter your email">

      <label>Age</label>
      <input type="number" placeholder="Please enter your age">

      <label>Choose an option</label>
      <select>
        <option>Select One Option</option>
        <option>Option 1</option>
        <option>Option 2</option>
      </select>

      <label>Do you plan to buy a new car in the next 5 years?</label>
      <label><input type="radio" name="buycar"> Yes</label>
      <label><input type="radio" name="buycar"> No</label>
      <label><input type="radio" name="buycar"> Maybe</label>

      <label>What is your favorite car brand?</label>
      <select>
        <option>Select One Option</option>
        <option>Toyota</option>
        <option>Ford</option>
        <option>Chevrolet</option>
        <option>Other</option>
      </select>

      <label>What type of means of transportation do you own?</label>
      <label><input type="checkbox"> Car</label>
      <label><input type="checkbox"> Boat</label>
      <label><input type="checkbox"> Bicycle</label>
      <label><input type="checkbox"> Motorcycle</label>
      <label><input type="checkbox"> Plane</label>
      <label><input type="checkbox"> Bike</label>

      <label>Any comments suggestions?</label>
      <textarea rows="3" placeholder="Please enter your comments"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
            
    
</body>
</html>
